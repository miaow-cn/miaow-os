schema_version = 1

[[requirements]]
id = "REQ-TOOL-001"
title = "Validate the requirement register"
statement = "The local check shall validate the authoritative requirement register before executing tests."
status = "implemented"
acceptance = [
    "Reject invalid TOML, unsupported schema versions, unknown fields, and an empty register.",
    "Reject duplicate or malformed IDs, blank text, empty acceptance criteria, and invalid states.",
    "Accept planned, implemented, and retired requirements with unique REQ-AREA-NNN identifiers.",
]

[[requirements]]
id = "REQ-TOOL-002"
title = "Enforce executable test traceability"
statement = "The local check shall validate links from discovered unittest methods to requirement IDs."
status = "implemented"
acceptance = [
    "Reject empty discovery, duplicate test IDs, missing or invalid links, and links to unknown or retired requirements.",
    "Reject implemented requirements without tests; allow uncovered planned and retired requirements.",
    "Support multiple tests per requirement and multiple requirements per test without running tests during link validation.",
]

[[requirements]]
id = "REQ-TOOL-003"
title = "Report actual verification outcomes"
statement = "The local check shall execute the validated suite once and report current test outcomes against requirements."
status = "implemented"
acceptance = [
    "Generate build/test-results.json with test IDs, requirement links, outcomes, diagnostics, and requirement summaries.",
    "Fail the gate on structural errors, failures, errors, unexpected successes, skips, expected failures, or incomplete execution.",
    "Preserve failed or skipped subtest outcomes even when other subtests pass; capture discovery and fixture errors.",
    "Mark planned requirements pending and retired requirements retired; never use implementation state as passing evidence.",
    "Remove the previous report before validation so an interrupted or invalid run cannot reuse stale evidence.",
]

[[requirements]]
id = "REQ-BUILD-001"
title = "Build a freestanding kernel and independent applications"
statement = "The build shall produce an AArch64 freestanding C23 kernel and three independently linked application ELF/bin pairs packaged into one boot image."
status = "implemented"
acceptance = [
    "Compile for Cortex-A710 with -std=c23 and __STDC_VERSION__ >= 202311L; link without a hosted runtime, PIE, or dynamic linking.",
    "Build kernel and applications with general-purpose registers only; no floating-point, SIMD, or SVE context is required.",
    "Normal kernel sources contain no test-only conditional paths or self-test routines; separate test images reuse the same production object files and normal images remain independently bootable.",
    "Rebuilding an application updates its independent ELF/bin and the packaged boot image.",
    "Reject nonempty application writable static storage, COMMON, TLS, runtime initialization sections, and images exceeding their reserved space; accept code, read-only constants, and stack-local state.",
]

[[requirements]]
id = "REQ-BOOT-001"
title = "Boot the learning kernel on Cortex-A710"
statement = "The kernel shall boot on a single QEMU virt Cortex-A710 CPU with GICv3 and run at EL1."
status = "implemented"
acceptance = [
    "Boot headlessly with 128 MiB RAM, virtualization and security extensions disabled, and PL011 serial output.",
    "Initialize the kernel stack, zero BSS, and install an aligned EL1 exception vector table before entering applications.",
    "Runtime observations confirm CurrentEL is EL1, SCTLR_EL1.M is set, and C and I remain clear; unexpected entry levels produce a diagnostic and halt.",
]

[[requirements]]
id = "REQ-APP-001"
title = "Load and run three independent EL0 demos"
statement = "The kernel shall copy three embedded application binaries into fixed physical slots and start each at EL0 with its own stack."
status = "implemented"
acceptance = [
    "Validate image and stack bounds before copying; loaded bytes match their source and application slots do not overlap each other or the kernel.",
    "Each initial context uses EL0t, its linked entry point, and a separate 16-byte-aligned stack; saved runtime stack pointers remain in that application's stack range.",
    "Integer-sequence, prime-calculation, and checksum demos each produce identifiable progress and a correct final result using logging syscalls, then exit.",
    "Applications use stack-local mutable state and read-only constants without requiring writable global variables; returning from app_main invokes exit.",
]

[[requirements]]
id = "REQ-EXC-001"
title = "Preserve integer context across EL transitions"
statement = "The kernel shall preserve application integer execution state across EL0 exceptions and resume the selected application with ERET."
status = "implemented"
acceptance = [
    "Repeated timer preemption preserves x0-x30, SP_EL0, ELR_EL1, and SPSR_EL1 including condition flags.",
    "Runtime exception observations confirm an EL0t origin and EL1 handling; resumed applications have IRQ enabled while kernel handlers keep IRQ masked without nesting.",
    "An unexpected EL0 synchronous exception reports task identity, ESR, and ELR, stops that task, and allows another runnable task to continue.",
    "An unexpected EL1 exception reports ESR and ELR and halts instead of returning to a damaged context.",
]

[[requirements]]
id = "REQ-SCHED-001"
title = "Preempt applications in round-robin order"
statement = "The kernel shall use the architectural physical timer through GICv3 to preempt EL0 applications and select the next runnable task from a fixed array."
status = "implemented"
acceptance = [
    "Configure a nominal 10 ms quantum from CNTFRQ_EL0 and handle physical timer PPI 30 through the GICv3 redistributor and system-register CPU interface, rearming and completing each interrupt.",
    "Applications that issue no system call still make progress through at least three complete timer-driven rounds in task order; preemption never depends on voluntary yielding.",
    "Skip exited and faulted tasks, wrap to the first runnable task, and resume the same task when it is the only runnable one.",
    "When no runnable tasks remain, disable the timer and report completion before idling; never resume an exited or faulted task.",
    "Handle spurious interrupt IDs without scheduling or issuing an invalid end-of-interrupt operation.",
]

[[requirements]]
id = "REQ-SYS-001"
title = "Provide bounded logging and exit system calls"
statement = "EL0 applications shall request serial logging and termination through an SVC-based EL1 system-call interface."
status = "implemented"
acceptance = [
    "Use SVC #0 with x8 as the call number, x0/x1 as arguments, and x0 as the signed return value; provide log(pointer, length) and exit(status).",
    "Log exactly the requested payload from the current application's loaded image or stack and return its byte count; a kernel task prefix is excluded from that count.",
    "Accept lengths from 0 through 256 bytes; zero length returns zero without dereferencing the pointer, and oversized requests return -EINVAL.",
    "Reject invalid, wrapping, cross-boundary, other-task, kernel, and device buffer ranges with -EFAULT; unknown calls return -ENOSYS without terminating the task.",
    "Exit records the status and never returns; logging does not voluntarily yield or terminate the application, and other registers are preserved.",
]

[[requirements]]
id = "REQ-PRINT-001"
title = "Format kernel diagnostics through printk"
statement = "Kernel diagnostic messages shall be produced by a printk-style variadic formatter routed to the PL011 UART."
status = "implemented"
acceptance = [
    "snprintf and vsnprintf support the conversions %%, %c, %s, %d, %i, %u, %o, %x, %X, and %p with flags, width, precision, and length qualifiers, and render a NULL string argument without dereferencing it.",
    "snprintf writes at most size bytes including the terminator and returns the untruncated formatted length.",
    "Boot, LOADED, TRAP, TIMER, PANIC, FAULT, and EXIT diagnostics keep their established textual layouts with 16-digit lowercase hexadecimal fields when emitted through printk.",
    "The raw application log payload path stays byte-exact and does not pass through the formatter.",
]

[[requirements]]
id = "REQ-LIB-001"
title = "Provide freestanding memory and list primitives"
statement = "The kernel shall provide memset, memcpy, memmove, and memcmp plus an intrusive doubly linked list."
status = "implemented"
acceptance = [
    "memset, memcpy, memmove, and memcmp handle zero length, byte-aligned and eight-byte-aligned operands, and memmove copies correctly for forward, backward, and exactly overlapping ranges.",
    "On Normal RAM after MMU initialization, memory primitives support every byte offset and ranges crossing 4 KiB page boundaries without reading or writing outside the requested ranges; they are not MMIO or MMU-off interfaces.",
    "MMU initialization explicitly clears SCTLR_EL1.A so ordinary unaligned RAM loads and stores work, without disabling stack alignment checks or changing cache policy.",
    "The list provides initialization, head and tail insertion, removal, emptiness, first-entry, and iteration, and a removed entry can be reinserted.",
]

[[requirements]]
id = "REQ-MM-001"
title = "Describe and reserve physical memory"
statement = "The kernel shall record the physical memory it may use and reserve the ranges occupied by firmware data, its own image, and application slots through a memblock-style early allocator."
status = "implemented"
acceptance = [
    "Preserve the device tree pointer supplied in x0 at reset, report it in the boot diagnostics, and confirm at run time that it lies inside RAM and carries the flattened device tree magic.",
    "Link-time symbols delimit the kernel image so the reserved range covers the firmware area below the kernel, the image, BSS, and the kernel stack.",
    "Regions are kept sorted and adjacent or overlapping regions are merged; reserving part of a region splits it without losing or duplicating memory.",
    "Early allocation returns the lowest range satisfying the requested size and alignment, marks it reserved, and returns null when no range fits.",
]

[[requirements]]
id = "REQ-MM-002"
title = "Allocate physical pages with a buddy allocator"
statement = "The kernel shall manage free physical pages as power-of-two blocks, splitting larger blocks on allocation and merging buddies on release."
status = "implemented"
acceptance = [
    "Allocation of order n returns a block of 2^n pages aligned to its own size, or null when no block is available.",
    "A block is split from the smallest sufficient order, and the unused halves are returned to the lower free lists.",
    "Releasing a block merges it with its buddy while the buddy is free and of equal order; releasing everything restores the free lists to the state produced by initialization.",
    "Concurrently held allocations never overlap, and every page handed out lies inside the free ranges published by the early allocator.",
]

[[requirements]]
id = "REQ-MM-003"
title = "Allocate kernel objects with kmalloc"
statement = "The kernel shall provide kmalloc, kzalloc, and kfree over the page allocator using per-size-class slabs carved from single pages."
status = "implemented"
acceptance = [
    "Requests are rounded up to a power-of-two size class from 16 through 2048 bytes, and every returned pointer is at least 16-byte aligned.",
    "Requests larger than the largest size class fall back to whole pages, and the order is recorded so release needs only the pointer.",
    "Free objects are tracked inside the slab page itself; a slab whose objects are all free is returned to the page allocator.",
    "Live allocations never overlap, freed memory is reused by later requests, kzalloc returns zeroed memory, and kfree of a null pointer does nothing.",
]

[[requirements]]
id = "REQ-MM-004"
title = "Enable boot-time identity mappings"
statement = "The kernel shall enable the EL1 MMU with static three-level, 4 KiB identity mappings in a 39-bit TTBR0 address space while keeping instruction and data caches disabled."
status = "implemented"
acceptance = [
    "Map every page of the 128 MiB RAM at its physical address as Normal non-cacheable memory with inner-shareable page descriptors, including the kernel, stack, allocator memory, device tree, and application slots.",
    "Map the PL011 page at 0x09000000, the 64 KiB GIC distributor at 0x08000000, and the 128 KiB CPU 0 redistributor at 0x080a0000 as privileged, non-executable Device-nGnRnE memory; leave other low-address ranges unmapped.",
    "Allow EL0 reads, writes, and execution in all three application slots through one shared compatibility mapping; no application-to-application isolation or RAM W^X is promised in this stage.",
    "Use page-aligned static tables reserved as part of the kernel image, publish them with barriers, invalidate stale TLB entries, and disable TTBR1 walks before enabling translation.",
]