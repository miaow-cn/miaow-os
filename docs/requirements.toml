schema_version = 1

[[requirements]]
id = "REQ-TOOL-001"
title = "Validate the requirement register"
statement = "The local check shall validate the authoritative requirement register before executing tests."
status = "implemented"
acceptance = [
    "Reject invalid TOML, unsupported schema versions, unknown fields, and an empty register.",
    "Reject duplicate or malformed IDs, blank text, empty acceptance criteria, and invalid states.",
    "Accept planned, implemented, and retired requirements with unique REQ-AREA-NNN identifiers.",
]

[[requirements]]
id = "REQ-TOOL-002"
title = "Enforce executable test traceability"
statement = "The local check shall validate links from discovered unittest methods to requirement IDs."
status = "implemented"
acceptance = [
    "Reject empty discovery, duplicate test IDs, missing or invalid links, and links to unknown or retired requirements.",
    "Reject implemented requirements without tests; allow uncovered planned and retired requirements.",
    "Support multiple tests per requirement and multiple requirements per test without running tests during link validation.",
]

[[requirements]]
id = "REQ-TOOL-003"
title = "Report actual verification outcomes"
statement = "The local check shall execute the validated suite once and report current test outcomes against requirements."
status = "implemented"
acceptance = [
    "Generate build/test-results.json with test IDs, requirement links, outcomes, diagnostics, and requirement summaries.",
    "Fail the gate on structural errors, failures, errors, unexpected successes, skips, expected failures, or incomplete execution.",
    "Preserve failed or skipped subtest outcomes even when other subtests pass; capture discovery and fixture errors.",
    "Mark planned requirements pending and retired requirements retired; never use implementation state as passing evidence.",
    "Remove the previous report before validation so an interrupted or invalid run cannot reuse stale evidence.",
]

[[requirements]]
id = "REQ-BUILD-001"
title = "Build a freestanding kernel and independent applications"
statement = "The build shall produce an AArch64 freestanding C23 kernel and three independently linked application ELF/bin pairs packaged into one boot image."
status = "implemented"
acceptance = [
    "Compile for Cortex-A710 with -std=c23 and __STDC_VERSION__ >= 202311L; link without a hosted runtime, PIE, or dynamic linking.",
    "Build kernel and applications with general-purpose registers only; no floating-point, SIMD, or SVE context is required.",
    "Normal kernel sources contain no test-only conditional paths or self-test routines; separate test images reuse the same production object files and normal images remain independently bootable.",
    "Rebuilding an application updates its independent ELF/bin and the packaged boot image.",
    "Reject writable static storage, COMMON, TLS, runtime initialization sections, and application images larger than 64 KiB.",
]

[[requirements]]
id = "REQ-BOOT-001"
title = "Boot the learning kernel on Cortex-A710"
statement = "The kernel shall boot on a single QEMU virt Cortex-A710 CPU with GICv3 and run at EL1."
status = "implemented"
acceptance = [
    "Boot headlessly with 128 MiB RAM, virtualization and security extensions disabled, and PL011 serial output.",
    "Initialize the kernel stack, zero BSS, and install an aligned EL1 exception vector table before entering applications.",
    "Runtime observations confirm CurrentEL is EL1 and SCTLR_EL1.M is set; unexpected entry levels produce a diagnostic and halt.",
]

[[requirements]]
id = "REQ-APP-001"
title = "Load and run three independent EL0 demos"
statement = "The kernel shall load and run three independent EL0 demos."
status = "implemented"
acceptance = [
    "Each image matches its embedded binary and starts at 0x400000 with a zeroed 16 KiB stack ending at 0x8000000000.",
    "Each initial context uses EL0t and a 16-byte-aligned stack; saved stack pointers stay within that stack.",
    "The sequence, primes, and checksum demos report their correct results and exit; returning from app_main invokes exit.",
    "Applications use stack-local state and read-only constants without writable globals.",
]

[[requirements]]
id = "REQ-EXC-001"
title = "Preserve integer context across EL transitions"
statement = "The kernel shall preserve application integer execution state across EL0 exceptions and resume the selected application with ERET."
status = "implemented"
acceptance = [
    "Repeated timer preemption preserves x0-x30, SP_EL0, ELR_EL1, and SPSR_EL1 including condition flags.",
    "Runtime exception observations confirm an EL0t origin and EL1 handling; resumed applications have IRQ enabled while kernel handlers keep IRQ masked without nesting.",
    "An unexpected EL0 synchronous exception reports task identity, ESR, FAR, and ELR, stops that task, and allows another runnable task to continue.",
    "An unexpected EL1 exception reports ESR, FAR, and ELR and halts instead of returning to a damaged context.",
]

[[requirements]]
id = "REQ-SCHED-001"
title = "Preempt applications in round-robin order"
statement = "The kernel shall use the architectural physical timer through GICv3 to preempt EL0 applications and select the next runnable task from a fixed array."
status = "implemented"
acceptance = [
    "Configure a nominal 10 ms quantum from CNTFRQ_EL0 and handle physical timer PPI 30 through the GICv3 redistributor and system-register CPU interface, rearming and completing each interrupt.",
    "Applications that issue no system call still make progress through at least three complete timer-driven rounds in task order; preemption never depends on voluntary yielding.",
    "Skip exited and faulted tasks, wrap to the first runnable task, and resume the same task when it is the only runnable one.",
    "When no runnable tasks remain, disable the timer and report completion before idling; never resume an exited or faulted task.",
    "Handle spurious interrupt IDs without scheduling or issuing an invalid end-of-interrupt operation.",
]

[[requirements]]
id = "REQ-SYS-001"
title = "Provide bounded logging and exit system calls"
statement = "EL0 applications shall request serial logging and termination through an SVC-based EL1 system-call interface."
status = "implemented"
acceptance = [
    "Use SVC #0 with x8 as the call number, x0/x1 as arguments, and x0 as the signed result; provide log and exit.",
    "Log up to 256 bytes from the caller's image or stack and return the payload length, excluding the task prefix.",
    "Zero-length logs return zero; oversized logs return -EINVAL; invalid or crossing ranges return -EFAULT; unknown calls return -ENOSYS.",
    "Exit records the status and never returns; logging preserves the other registers and does not yield.",
]

[[requirements]]
id = "REQ-PRINT-001"
title = "Format kernel diagnostics through printk"
statement = "Kernel diagnostic messages shall be produced by a printk-style variadic formatter routed to the PL011 UART."
status = "implemented"
acceptance = [
    "snprintf and vsnprintf support the conversions %%, %c, %s, %d, %i, %u, %o, %x, %X, and %p with flags, width, precision, and length qualifiers, and render a NULL string argument without dereferencing it.",
    "snprintf writes at most size bytes including the terminator and returns the untruncated formatted length.",
    "Boot, LOADED, TRAP, TIMER, PANIC, FAULT, and EXIT diagnostics keep their established textual layouts with 16-digit lowercase hexadecimal fields when emitted through printk.",
    "The raw application log payload path stays byte-exact and does not pass through the formatter.",
]

[[requirements]]
id = "REQ-LIB-001"
title = "Provide freestanding memory and list primitives"
statement = "The kernel shall provide memset, memcpy, memmove, and memcmp plus an intrusive doubly linked list."
status = "implemented"
acceptance = [
    "memset, memcpy, memmove, and memcmp handle zero length, byte-aligned and eight-byte-aligned operands, and memmove copies correctly for forward, backward, and exactly overlapping ranges.",
    "On Normal RAM after MMU initialization, memory primitives support every byte offset and ranges crossing 4 KiB page boundaries without reading or writing outside the requested ranges; they are not MMIO or MMU-off interfaces.",
    "MMU initialization explicitly clears SCTLR_EL1.A so ordinary unaligned RAM loads and stores work, without disabling stack alignment checks.",
    "The list provides initialization, head and tail insertion, removal, emptiness, first-entry, and iteration, and a removed entry can be reinserted.",
]

[[requirements]]
id = "REQ-MM-001"
title = "Describe and reserve physical memory"
statement = "The kernel shall record usable physical memory and reserve firmware and kernel data through an early allocator."
status = "implemented"
acceptance = [
    "Preserve and report the device tree pointer, validate its RAM location and magic, and reserve the blob.",
    "Reserve the firmware area, kernel image, BSS, and kernel stack.",
    "Keep regions sorted and merged; partial reservations split regions without loss or duplication.",
    "Allocate the lowest free range satisfying the size and alignment, or return null if none fits.",
]

[[requirements]]
id = "REQ-MM-002"
title = "Allocate physical pages with a buddy allocator"
statement = "The kernel shall manage free physical pages as power-of-two blocks, splitting larger blocks on allocation and merging buddies on release."
status = "implemented"
acceptance = [
    "Allocation of order n returns a block of 2^n pages aligned to its own size, or null when no block is available.",
    "A block is split from the smallest sufficient order, and the unused halves are returned to the lower free lists.",
    "Releasing a block merges it with its buddy while the buddy is free and of equal order; releasing everything restores the free lists to the state produced by initialization.",
    "Concurrently held allocations never overlap, and every page handed out lies inside the free ranges published by the early allocator.",
]

[[requirements]]
id = "REQ-MM-003"
title = "Allocate kernel objects with kmalloc"
statement = "The kernel shall provide kmalloc, kzalloc, and kfree over the page allocator using per-size-class slabs carved from single pages."
status = "implemented"
acceptance = [
    "Requests are rounded up to a power-of-two size class from 16 through 2048 bytes, and every returned pointer is at least 16-byte aligned.",
    "Requests larger than the largest size class fall back to whole pages, and the order is recorded so release needs only the pointer.",
    "Free objects are tracked inside the slab page itself; a slab whose objects are all free is returned to the page allocator.",
    "Live allocations never overlap, freed memory is reused by later requests, kzalloc returns zeroed memory, and kfree of a null pointer does nothing.",
]

[[requirements]]
id = "REQ-MM-004"
title = "Enable the MMU through a boot-time identity mapping"
statement = "The kernel shall enable the EL1 MMU with static three-level, 4 KiB page tables in 39-bit TTBR0 and TTBR1 address spaces, crossing the switch through a temporary identity mapping."
status = "implemented"
acceptance = [
    "Map all 128 MiB of RAM as Normal memory.",
    "Map the PL011 page at physical 0x09000000, the 64 KiB GIC distributor at 0x08000000, and the 128 KiB CPU 0 redistributor at 0x080a0000 as privileged, non-executable Device-nGnRnE memory; leave other device ranges unmapped.",
    "While translation is being enabled, TTBR0 identity maps the physical addresses of all RAM, for EL1 by reusing the linear map's L2 table, so the code and stack in use stay reachable until execution continues at high addresses.",
    "Use page-aligned static tables reserved as part of the kernel image.",
]

[[requirements]]
id = "REQ-MM-005"
title = "Run the kernel at high virtual addresses"
statement = "The kernel shall run from a TTBR1 linear map of RAM and reach devices through fixed high mappings."
status = "implemented"
acceptance = [
    "Link the kernel at virtual 0xffffffc000080000 and load it at physical 0x40080000; on entry to start_kernel, PC, SP, and VBAR_EL1 hold high virtual addresses inside the kernel image.",
    "Map physical RAM 0x40000000-0x47ffffff linearly at 0xffffffc000000000 for EL1 only, and each mapped device page at 0xffffff8000000000 plus its physical address; all other TTBR1 addresses remain unmapped.",
    "Remove the identity mapping and invalidate stale TLB entries before start_kernel; TTBR0 is empty until an application starts.",
]

[[requirements]]
id = "REQ-MM-006"
title = "Enforce page permissions"
statement = "The kernel shall map each page with only the access its use requires, so that no mapping is both writable and executable and kernel code has no writable alias."
status = "implemented"
acceptance = [
    "Kernel text is EL1 read-only executable and read-only data is EL1 read-only; all other RAM is EL1 read/write; only text is executable, and no RAM mapping in TTBR1 is accessible from EL0.",
    "Each application image is EL0 read-only executable and its stack is EL0 read/write non-executable; both are non-executable at EL1.",
    "Text and read-only data are page-aligned; no mapping of text or read-only data is writable, and no mapping in either TTBR is writable and executable at the same exception level.",
    "At EL1, writing text or read-only data, executing read-only data, data, stack, or application pages, and reading an unmapped address raise level 3 permission or translation faults with FAR set to the address.",
    "At EL0, writing application code, executing the application stack, and reading kernel memory raise level 3 permission faults; the kernel stops that task and keeps running the others.",
]

[[requirements]]
id = "REQ-MM-007"
title = "Enable coherent instruction and data caching"
statement = "The kernel shall enable instruction and data caches, synchronize copied application code before execution, and complete local TLB invalidation after publishing page-table changes."
status = "implemented"
acceptance = [
    "Before start_kernel, SCTLR_EL1.C and I are set; RAM pages and both TCR table walks use inner-shareable inner/outer write-back read/write-allocate attributes, with MAIR RAM index 1 set to 0xff; devices remain nGnRnE.",
    "Invalidate the local instruction cache with completion and instruction barriers before enabling it; after each application copy, clean every intersecting D-cache line to PoU using CTR_EL0.DminLine, complete the clean, invalidate all local I-cache aliases, and complete synchronization before entering EL0.",
    "Publish table writes before local TLBI VMALLE1 with DSB ISHST, then complete it with DSB ISH and ISB; replacing TTBR0 removes the boot identity mapping, and a cached valid-to-invalid-to-valid leaf update observes each new translation after synchronization."
]

[[requirements]]
id = "REQ-MM-008"
title = "Edit page tables at run time"
statement = "The kernel shall build, change, and free TTBR0 page tables after boot using tables from the page allocator."
status = "implemented"
acceptance = [
    "pgd_alloc returns a zeroed root page; pte_alloc adds each missing zeroed L2/L3 table once, linked by physical address, and reuses existing tables.",
    "On a live root, set_pte_at replacing a cached valid leaf uses break-before-make, and the VA then reads the new page with the new permissions; pte_clear leaves a level 3 translation fault.",
    "pgd_free releases the root and all its L2/L3 tables; after the leaf pages are freed, nr_free_pages equals its baseline.",
]

[[requirements]]
id = "REQ-VM-001"
title = "Isolate application address spaces"
statement = "The kernel shall give each application its own virtual address space."
status = "implemented"
acceptance = [
    "The same image and stack virtual addresses map to separate physical pages for each application.",
    "Each task switch uses its own page table without stale translations; kernel mappings stay unchanged.",
    "Applications cannot access another application's memory.",
]